[package]
name = "cobalt-desktop"
version = "1.0.1"
edition = "2021"
description = "A modern desktop client for cobalt — save video & audio from the web with your own instance"
authors = ["Berkay AY <shadesofdeath@users.noreply.github.com>"]
repository = "https://github.com/shadesofdeath/cobalt-desktop"
homepage = "https://github.com/shadesofdeath/cobalt-desktop"
readme = "README.md"
license = "MIT AND CC-BY-NC-SA-4.0"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links", "wgpu", "accesskit", "__screenshot"] }
egui = { version = "0.36", features = ["serde"] }
egui_extras = { version = "0.36", features = ["svg", "image", "webp", "gif"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "charset", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rfd = "0.17"
directories = "6"
open = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
chrono = "0.4"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
